<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
    --bg: #eef2f7;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #2563eb;
    --brand-dark: #1d4ed8;
    --nav: #111827;
}

* {
    box-sizing: border-box;
}

body {
    display: flex;
    min-height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', sans-serif;
}

.sidebar {
    width: 240px;
    height: 100vh;
    background: var(--nav);
    color: white;
    padding: 24px 18px;
    position: fixed;
    box-shadow: 8px 0 30px rgba(15, 23, 42, 0.15);
}

.sidebar h2 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0;
    margin-bottom: 34px;
    padding-left: 10px;
}

.sidebar a {
    display: block;
    color: #cbd5e1;
    padding: 12px 14px;
    margin: 8px 0;
    text-decoration: none;
    border-radius: 8px;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
}

.sidebar a:hover,
.sidebar a.active {
    background: rgba(37, 99, 235, 0.22);
    color: white;
    transform: translateX(3px);
}

.mobile-bar,
.nav-overlay {
    display: none;
}

.content {
    margin-left: 240px;
    padding: 34px;
    width: 100%;
}

.container {
    margin-top: 0;
    max-width: 620px;
    margin-left: 0;
    animation: fadeIn 0.55s ease both;
}

.form-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
}

h2 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 20px;
}

.form-control {
    border-radius: 8px;
    border-color: var(--line);
    min-height: 44px;
}

.form-control:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.14);
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
}

.tool-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
    margin-top: 18px;
    padding: 18px;
}

.tool-panel h5 {
    font-weight: 800;
    margin-bottom: 12px;
}

.popup-overlay {
    align-items: center;
    background: rgba(15, 23, 42, 0.42);
    display: none;
    inset: 0;
    justify-content: center;
    position: fixed;
    z-index: 50;
}

.popup-overlay.show {
    display: flex;
}

.popup-box {
    animation: popIn 0.25s ease both;
    background: var(--panel);
    border-radius: 8px;
    box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
    max-width: 420px;
    padding: 26px;
    text-align: center;
    width: calc(100% - 32px);
}

.popup-box h4 {
    font-weight: 800;
    margin-bottom: 10px;
}

.popup-box p {
    color: var(--muted);
    margin-bottom: 20px;
}

.btn {
    border-radius: 8px;
    min-height: 42px;
    font-weight: 700;
}

.btn-primary {
    background: var(--brand);
    border-color: var(--brand);
}

.btn-primary:hover {
    background: var(--brand-dark);
    border-color: var(--brand-dark);
}

#status {
    color: var(--brand-dark);
    font-weight: 800;
    min-height: 24px;
    margin: 18px 0;
}

video {
    width: 100%;
    border-radius: 8px;
    display: none;
    border: 1px solid var(--line);
    box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
    animation: fadeIn 0.35s ease both;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(14px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes popIn {
    from {opacity: 0; transform: scale(0.96) translateY(10px);}
    to {opacity: 1; transform: scale(1) translateY(0);}
}

@media (max-width: 768px) {
    body {
        display: block;
        padding-top: 58px;
    }

    .mobile-bar {
        align-items: center;
        background: var(--nav);
        color: white;
        display: flex;
        height: 58px;
        justify-content: space-between;
        left: 0;
        padding: 0 16px;
        position: fixed;
        right: 0;
        top: 0;
        z-index: 30;
    }

    .menu-btn {
        background: rgba(255,255,255,0.12);
        border: 0;
        border-radius: 8px;
        color: white;
        font-size: 22px;
        height: 38px;
        transition: background 0.2s ease, transform 0.2s ease;
        width: 42px;
    }

    .menu-btn:active {
        transform: scale(0.96);
    }

    .nav-overlay {
        background: rgba(15, 23, 42, 0.48);
        display: block;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        position: fixed;
        transition: opacity 0.28s ease;
        z-index: 20;
    }

    .nav-overlay.show {
        opacity: 1;
        pointer-events: auto;
    }

    .sidebar {
        box-shadow: 18px 0 44px rgba(15, 23, 42, 0.22);
        height: 100vh;
        left: 0;
        position: fixed;
        top: 0;
        transform: translateX(-105%);
        transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform;
        width: 260px;
        z-index: 40;
    }

    .sidebar.show {
        transform: translateX(0);
    }

    .sidebar h2 {
        margin-bottom: 12px;
        padding-left: 0;
    }

    .sidebar a {
        display: block;
        margin: 8px 0;
        padding: 12px 14px;
    }

    .content {
        margin-left: 0;
        padding: 18px;
        width: 100%;
    }

    .container {
        max-width: none;
        width: 100%;
    }

    .form-panel,
    .tool-panel {
        padding: 14px;
    }

    h2 {
        font-size: 24px;
    }

    .actions .btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="popup-overlay" id="toolPopup">
    <div class="popup-box">
        <h4 id="popupTitle">Done</h4>
        <p id="popupMessage">Action completed.</p>
        <button class="btn btn-primary" onclick="closePopup()">OK</button>
    </div>
</div>

<div class="mobile-bar">
    <strong>AttendX
    </strong>
    <button class="menu-btn" onclick="toggleMobileNav()">☰</button>
</div>
<div class="nav-overlay" id="navOverlay" onclick="closeMobileNav()"></div>

<div class="sidebar" id="sidebar">
    <h2>AttendX</h2>
    <a href="/register" class="active">Register</a>
    <a href="/students">Students</a>
    <a href="/">Dashboard</a>
    <a href="/attendance">Attendance</a>
    <a href="/reports">Reports</a>
    <a href="/backup_db">Backup DB</a>
    <a href="/logout">Logout</a>
</div>

<div class="content">
<div class="container">

<h2 class="mb-3">Register Student</h2>

<div class="form-panel">

<!-- PROGRAM -->
<select id="program" class="form-control mb-2">
    <option value="">Select Program</option>
    <option value="UG">UG</option>
    <option value="PG">PG</option>
</select>

<!-- NAME -->
<input id="name" class="form-control mb-2" placeholder="Full Name">

<!-- REGISTER NUMBER -->
<input id="reg" class="form-control mb-2" placeholder="Register Number">

<!-- DEPARTMENT -->
<select id="dept" class="form-control mb-2">
    <option value="">Select Department</option>
    <option value="ECE">ECE</option>
    <option value="CSE">CSE</option>
    <option value="EEE">EEE</option>
    <option value="MECH">MECH</option>
</select>

<!-- YEAR -->
<select id="year" class="form-control mb-2">
    <option value="">Select Year</option>
</select>

<!-- SECTION -->
<input id="section" class="form-control mb-3" placeholder="Section (A/B/C)">

<!-- CAMERA -->
<select id="cameraSelect" class="form-control mb-3"></select>

<div class="actions">
<button class="btn btn-primary" onclick="startCamera()">Open Camera</button>
<button class="btn btn-danger" onclick="stopCamera()">Close Camera</button>
<button class="btn btn-success" onclick="startAutoCapture()">Register Student</button>
</div>

<p id="status"></p>

<video id="video" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>

</div>

<div class="tool-panel">
    <h5>System Tools</h5>
    <input id="recognitionCameraIndex" class="form-control mb-2" type="number" min="0" value="0" placeholder="Recognition camera index">
    <div class="actions">
        <button class="btn btn-primary" onclick="trainModel()">Train Face Model</button>
        <button class="btn btn-success" onclick="startRecognition()">Start Recognition</button>
        <button class="btn btn-danger" onclick="stopRecognition()">Stop Recognition</button>
    </div>
    <p id="toolStatus"></p>
</div>

</div>
</div>

<script>
let stream;
const video = document.getElementById('video');
const cameraSelect = document.getElementById('cameraSelect');

function toggleMobileNav() {
    document.getElementById("sidebar").classList.toggle("show");
    document.getElementById("navOverlay").classList.toggle("show");
}

function closeMobileNav() {
    document.getElementById("sidebar").classList.remove("show");
    document.getElementById("navOverlay").classList.remove("show");
}

// Dynamic Year
const programSelect = document.getElementById('program');
const yearSelect = document.getElementById('year');

programSelect.addEventListener('change', function () {

    const program = programSelect.value;
    yearSelect.innerHTML = '<option value="">Select Year</option>';

    let maxYear = program === "PG" ? 2 : 4;

    for (let i = 1; i <= maxYear; i++) {
        let option = document.createElement("option");
        option.value = i;
        option.text = i;
        yearSelect.appendChild(option);
    }
});

// Load Cameras
navigator.mediaDevices.enumerateDevices()
.then(devices => {
    devices.forEach(device => {
        if (device.kind === "videoinput") {
            let option = document.createElement("option");
            option.value = device.deviceId;
            option.text = device.label || "Camera";
            cameraSelect.appendChild(option);
        }
    });
});

// Start Camera
function startCamera() {
    navigator.mediaDevices.getUserMedia({
        video: { deviceId: cameraSelect.value ? { exact: cameraSelect.value } : undefined }
    })
    .then(s => {
        stream = s;
        video.srcObject = stream;
        video.style.display = "block";
    })
    .catch(err => alert("Camera error: " + err));
}

// Stop Camera
function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.style.display = "none";
    }
}

// Auto capture
function startAutoCapture() {

    if (!stream) {
        alert("Open camera first!");
        return;
    }

    const name = document.getElementById('name').value;
    const reg = document.getElementById('reg').value;
    const program = document.getElementById('program').value;
    const dept = document.getElementById('dept').value;
    const year = document.getElementById('year').value;
    const section = document.getElementById('section').value;

    if (!name || !reg || !program || !dept || !year || !section) {
        alert("Please fill all fields!");
        return;
    }

    const status = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    let count = 0;
    const total = 20;

    function captureLoop() {

        if (count >= total) {
            status.innerText = "Registration Completed";
            return;
        }

        ctx.drawImage(video, 0, 0);
        const image = canvas.toDataURL('image/jpeg', 0.5);

        status.innerText = `Capturing ${count + 1} / ${total}`;

        fetch('/save_face', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                image: image,
                name: name,
                reg: reg,
                program: program,
                dept: dept,
                year: year,
                section: section
            })
        })
        .then(() => {
            count++;
            setTimeout(captureLoop, 200);
        })
        .catch(() => {
            status.innerText = "Error while saving image";
        });
    }

    captureLoop();
}

function postTool(url) {
    const toolStatus = document.getElementById('toolStatus');
    const formData = new FormData();
    formData.append('camera_index', document.getElementById('recognitionCameraIndex').value || '0');
    toolStatus.innerText = 'Processing...';

    fetch(url, { method: 'POST', body: formData })
    .then(response => response.json())
    .then(data => {
        const message = data.message || 'Done';
        toolStatus.innerText = message;
        showPopup(data.success ? 'Completed' : 'Action Failed', message);
    })
    .catch(() => {
        const message = 'Action failed';
        toolStatus.innerText = message;
        showPopup('Action Failed', message);
    });
}

function trainModel() {
    postTool('/train_model');
}

function startRecognition() {
    postTool('/recognition/start');
}

function stopRecognition() {
    postTool('/recognition/stop');
}

function showPopup(title, message) {
    document.getElementById('popupTitle').innerText = title;
    document.getElementById('popupMessage').innerText = message;
    document.getElementById('toolPopup').classList.add('show');
}

function closePopup() {
    document.getElementById('toolPopup').classList.remove('show');
}
</script>

</body>
</html>
