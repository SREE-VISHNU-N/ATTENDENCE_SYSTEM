<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { min-height:100vh; display:grid; place-items:center; margin:0; background:#eef2f7; font-family:'Segoe UI', sans-serif; color:#172033; }
.panel { width:min(440px, calc(100% - 32px)); background:white; border:1px solid #e2e8f0; border-radius:8px; box-shadow:0 18px 42px rgba(15,23,42,.1); padding:30px; }
h2 { font-weight:800; margin-bottom:12px; }
p { color:#64748b; line-height:1.6; }
.btn { border-radius:8px; font-weight:700; min-height:42px; }
</style>
</head>
<body>
<div class="panel">
    <h2>Reset Password</h2>
    <p>For this local attendance system, open the project `.env` file and update `ADMIN_PASSWORD`, then restart Flask.</p>
    <a class="btn btn-primary w-100" href="/login">Back to Login</a>
</div>
</body>
</html>
